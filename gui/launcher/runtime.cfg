# The private R environment run_data_interpreter.bat builds on first run and
# then always runs in. It lives outside the repository, in
#   %LOCALAPPDATA%\CCR\understory_kelp_indicator
# Change a value here and the next start builds a fresh environment for it.
#
# R_VERSION      the R for Windows release, from CRAN
# R_SHA256       checksum of R-<R_VERSION>-win.exe; a download that does not
#                match is refused. For 4.6.1 the MD5 was also checked against
#                CRAN's published fingerprint (md5sum.R-4.6.1.txt).
# CRAN_SNAPSHOT  the day's CRAN snapshot the packages come from (Posit Package
#                Manager), so every computer gets the same package versions
# LIBRARY_REV    bump this when the package list in install_packages.R changes
R_VERSION=4.6.1
R_SHA256=c5424c40cd70ef85765a55d2ff96bb602b5f30ed536938ff004f14db5db3c2df
CRAN_SNAPSHOT=2026-10-01
LIBRARY_REV=2
